<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lamp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="mobile-container">
        <header class="app-header">
            <h1>SMART 💡</h1>
        </header>

        <main class="main-content">
            
            <div class="remote-card-white">
                <div class="remote-grid">
                    <button class="btn btn-light" onclick="sendCommand('BRIGHT_UP')">B+</button>
                    <button class="btn btn-light" onclick="sendCommand('BRIGHT_DOWN')">B-</button>
                    <button class="btn btn-dark" onclick="sendCommand('POWER_OFF')">OFF</button>
                    <button class="btn btn-red-power" onclick="sendCommand('POWER_ON')">ON</button>
                    <button class="btn btn-red" onclick="sendCommand('COLOR_RED')">R</button>
                    <button class="btn btn-green" onclick="sendCommand('COLOR_GREEN')">G</button>
                    <button class="btn btn-blue" onclick="sendCommand('COLOR_BLUE')">B</button>
                    <button class="btn btn-white" onclick="sendCommand('COLOR_WHITE')">W</button>
                    <button class="btn btn-light-red" onclick="sendCommand('COLOR_LIGHT_RED')"></button>
                    <button class="btn btn-light-green" onclick="sendCommand('COLOR_LIGHT_GREEN')"></button>
                    <button class="btn btn-light-blue" onclick="sendCommand('COLOR_LIGHT_BLUE')"></button>
                    <button class="btn btn-mode" onclick="sendCommand('MODE_FLASH')">FLASH</button>
                    <button class="btn btn-orange" onclick="sendCommand('COLOR_ORANGE')"></button>
                    <button class="btn btn-turquoise" onclick="sendCommand('COLOR_TURQUOISE')"></button>
                    <button class="btn btn-purple" onclick="sendCommand('COLOR_PURPLE')"></button>
                    <button class="btn btn-mode" onclick="sendCommand('MODE_STROBE')">STROBE</button>
                    <button class="btn btn-light-orange" onclick="sendCommand('COLOR_LIGHT_ORANGE')"></button>
                    <button class="btn btn-dark-turquoise" onclick="sendCommand('COLOR_DARK_TURQUOISE')"></button>
                    <button class="btn btn-light-purple" onclick="sendCommand('COLOR_LIGHT_PURPLE')"></button>
                    <button class="btn btn-mode" onclick="sendCommand('MODE_FADE')">FADE</button>
                    <button class="btn btn-yellow" onclick="sendCommand('COLOR_YELLOW')"></button>
                    <button class="btn btn-dark-blue" onclick="sendCommand('COLOR_DARK_BLUE')"></button>
                    <button class="btn btn-pink" onclick="sendCommand('COLOR_PINK')"></button>
                    <button class="btn btn-mode" onclick="sendCommand('MODE_SMOOTH')">SMOOTH</button>
                </div>
            </div>

            <section class="card quick-control">
                <div class="night-mode-group">
                    <div class="night-mode-header">
                        <div class="night-mode-text">
                            <span class="night-mode-title">Auto Night Mode</span>
                            <span class="night-mode-desc">Turns on when it gets dark</span>
                        </div>
                        <label class="main-switch small-switch">
                            <input type="checkbox" id="toggle-night-mode">
                            <span class="main-slider"></span>
                        </label>
                    </div>

                    <div class="threshold-control" id="threshold-section" style="display: none;">
                        <div class="threshold-labels">
                            <span>Sensitivity</span>
                            <span id="threshold-val">30%</span>
                        </div>
                        <input type="range" min="5" max="90" value="30" class="mobile-range" id="slider-threshold">
                    </div>
                </div>
            </section>

            <div class="presets-container">
                <h2>My Presets</h2>
                <div class="saved-presets" id="presets-list">
                    <p style="color: #888;">Loading presets...</p>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn primary" id="btn-open-add-preset">+ Add New Preset</button>
                <button class="action-btn secondary" id="btn-toggle-analytics">Show Analytics</button>
            </div>

            <div class="dashboard-wrapper" id="dashboard-section" style="display: none;">
                <div class="dashboard-container">
                    <h2>Light Analytics</h2>
                    <p class="dashboard-subtitle">Room light level (last 20 readings)</p>
                    <div class="chart-container">
                        <canvas id="lightChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="app-footer">
            <p>Developed by Tetiana Danylo and Anna Abramiak</p>
            <p>Support: <a href="mailto:smart-lamp@gmail.com">smart-lamp@gmail.com</a></p>
        </footer>
    </div>    

    <div class="modal-overlay" id="preset-modal" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Create New Preset</h3>
                <button class="modal-close-x" id="btn-close-add-preset">✕</button>
            </div>
            <form id="form-add-preset">
                <div class="form-group">
                    <label>Preset Name</label>
                    <input type="text" id="preset-name" placeholder="e.g., Party Mode, Sleep" class="modal-input" maxlength="20" required>
                </div>
               <div class="form-group">
    <label>Choose Color</label>
    <div id="color-palette" style="display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0;">
        <button type="button" class="color-btn" data-cmd="COLOR_RED" style="background:#FF0400; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"></button>
        <button type="button" class="color-btn" data-cmd="COLOR_GREEN" style="background:#097C0F; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"></button>
        <button type="button" class="color-btn" data-cmd="COLOR_BLUE" style="background:#085495; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"></button>
        <button type="button" class="color-btn" data-cmd="COLOR_WHITE" style="background:#FFFFFF; width:35px; height:35px; border-radius:50%; border:1px solid #ccc; cursor:pointer;"></button>
        <button type="button" class="color-btn" data-cmd="COLOR_PINK" style="background:#FF00AE; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"></button>
        <button type="button" class="color-btn" data-cmd="COLOR_ORANGE" style="background:#FF8C00; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"></button>
        <button type="button" class="color-btn" data-cmd="COLOR_PURPLE" style="background:#51009C; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"></button>
    </div>
</div>
                <div class="form-group">
                    <div class="brightness-labels">
                        <label>Brightness</label>
                        <span id="preset-brightness-val">100%</span>
                    </div>
                    <input type="range" id="preset-brightness" min="5" max="100" value="100" class="modal-range">
                </div>
                <button type="submit" class="modal-save-btn">Save Preset</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
